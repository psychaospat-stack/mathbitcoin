<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🪙 Math Bitcoin • Solve. Earn. ⚡</title>
    <meta name="description" content="MathBitcoin — Résous des calculs et gagne des sats Lightning ⚡. Jeu crypto éducatif ultra-rapide.">
    <meta name="theme-color" content="#0a0a0a">

    <link rel="icon" href="favicon.png" type="image/png">

    <!-- Performance boost -->
    <link rel="preconnect" href="https://pagead2.googlesyndication.com">
    <link rel="preconnect" href="https://googleads.g.doubleclick.net">

    <!-- Open Graph -->
    <meta property="og:title" content="MathBitcoin — Résous. Gagne. ⚡">
    <meta property="og:description" content="Résous des calculs, gagne des sats Lightning. Jeu math-crypto ultra-rapide.">
    <meta property="og:image" content="https://psychaospat-stack.github.io/mathbitcoin/preview.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://psychaospat-stack.github.io/mathbitcoin/">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MathBitcoin — Solve & Earn ⚡">
    <meta name="twitter:description" content="Résous des calculs et gagne des sats Lightning.">
    <meta name="twitter:image" content="https://psychaospat-stack.github.io/mathbitcoin/preview.png">

    <!-- Adsense -->
    <script async 
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3982413989310016"
        crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <h1 class="header_title">⚡ Math Bitcoin</h1>
            <p class="header_subtitle">
                Résous. Gagne. Améliore ton cerveau.  
                <span style="color:#f2c94c">Chaque bonne réponse = des sats ⚡</span>
            </p>
        </header>

        <!-- ACTION BUTTONS -->
        <div class="actions">
            <button id="startGame" class="btn_primary">🎮 Commencer</button>
            <button id="withdrawSats" class="btn_secondary">⚡ Retirer mes sats</button>
        </div>

        <!-- GAME ZONE -->
        <section id="gameZone" class="game_zone hidden">

            <div class="question_box">
                <h2 id="questionText">3 + 7 = ?</h2>
            </div>

            <input 
                id="answerInput" 
                class="answer_input"
                type="number" 
                placeholder="Ta réponse…" 
                autocomplete="off"
            />

            <button id="submitAnswer" class="btn_primary">
                ✅ Soumettre
            </button>
        </section>

        <!-- STATS -->
        <section class="stats_section">
            <h3 class="stats_title">⚡ Tes Stats</h3>

            <div class="stats_grid">

                <div class="stat_card">
                    <div class="stat_value" id="totalSatoshis">0</div>
                    <div class="stat_label">Satoshis gagnés ⚡</div>
                </div>

                <div class="stat_card">
                    <div class="stat_value" id="totalQuestions">0</div>
                    <div class="stat_label">Questions répondues</div>
                </div>

                <div class="stat_card">
                    <div class="stat_value" id="accuracy">0%</div>
                    <div class="stat_label">Précision</div>
                </div>

            </div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            ⚡ Powered by <strong>MathBitcoin</strong> • Lightning Fast Education
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
